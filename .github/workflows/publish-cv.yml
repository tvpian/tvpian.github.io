name: Publish research CV PDF

on:
  push:
    branches: [main]
    paths:
      - 'data/cv-source/cv.tex'
      - 'data/cv-source/resume_common.tex'
      - 'data/cv-source/publications.tex'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
      - name: Compile CV
        working-directory: data/cv-source
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error cv.tex
          pdflatex -interaction=nonstopmode -halt-on-error cv.tex
          test -s cv.pdf
          cp cv.pdf ../Tharun_Resume.pdf
      - name: Commit published PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/Tharun_Resume.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Publish updated research CV PDF"
            git push
          fi
