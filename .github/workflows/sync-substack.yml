name: Sync Substack essays

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh essay snapshot
        run: node scripts/sync-substack.mjs
      - name: Commit feed changes
        run: |
          if git diff --quiet -- human-in-the-loom/essays.json; then
            echo "Essay snapshot is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add human-in-the-loom/essays.json
          git commit -m "chore: sync Substack essays"
          git push
